<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Quantix</title><meta name="theme-color" content="#171b2b"><style>
*{box-sizing:border-box}body{margin:0;background:#171b2b;color:#e8ecf5;font:15px system-ui;min-height:100vh}button{font:inherit;color:inherit;border:0;cursor:pointer}.top{height:68px;background:#202438;display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid #30364b}.menu{font-size:25px;color:#98a2b7}.logo{width:40px;height:40px;border-radius:11px;background:#ff4560;display:grid;place-items:center;font-weight:900;font-size:21px}.balance{background:#252b40;border-radius:10px;padding:10px;color:#438bff;font-weight:700;flex:1;white-space:nowrap}.deposit{background:#3679ed;border-radius:10px;padding:11px 15px;font-weight:700}.tabs{display:flex;overflow:auto;gap:8px;padding:12px 10px 8px;white-space:nowrap;border-bottom:1px solid #34394d}.tab{padding:11px 14px;color:#929bb0;border-radius:25px;background:none}.tab.active{background:#22283c;color:#f3f6ff;border:1px solid #343d55;font-weight:700}.chartbox{margin:12px;height:275px;background:#1b2031;border:1px solid #30364b;border-radius:12px;position:relative;overflow:hidden}.charthead{position:absolute;top:12px;left:12px;background:#242a3e;border:1px solid #323950;border-radius:10px;padding:10px;z-index:2}.chart{width:100%;height:100%}.scale{position:absolute;right:5px;top:18px;bottom:14px;color:#8590a5;font-size:11px;display:flex;flex-direction:column;justify-content:space-between}.zoom{position:absolute;left:10px;bottom:12px;display:flex;flex-direction:column;gap:8px}.zoom button{background:#252b40;border:1px solid #343c53;border-radius:10px;width:42px;height:42px;font-size:23px}.nums{display:flex;justify-content:space-between;gap:3px;padding:12px 10px;overflow:hidden}.num{border:2px solid #2c344b;background:#20263a;border-radius:50%;width:clamp(34px,9.3vw,53px);height:clamp(34px,9.3vw,53px);flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px}.num small{font-size:9px;color:#99a4b8}.num.selected{border-color:#3679ed;box-shadow:0 0 9px #3679ed55}.mode{display:flex;margin:0 14px;border:1px solid #30364b;border-radius:11px;overflow:hidden;background:#22283a}.mode button{width:50%;padding:14px;font-weight:700;color:#98a2b7;background:transparent}.mode .on{background:#3979ed;color:white}.stake{display:flex;gap:9px;margin:13px 19px 0;align-items:stretch}.adj{width:58px;background:#252b3e;border-radius:11px;font-size:26px;color:#a0aabf}.stakebox{flex:1;border:2px solid #294b81;border-radius:16px;background:#1d2335;text-align:center;padding:9px 8px}.stakebox label{color:#4388f7;font-size:12px;font-weight:800}.stakevalue input{width:100px;background:none;border:0;color:white;text-align:center;font:800 28px system-ui;outline:0}.quick{display:flex;gap:6px;margin:11px 19px}.quick button{flex:1;padding:11px 3px;background:#22283a;border:1px solid #30364b;border-radius:9px;color:#8590a5;font-weight:700}.quick .chosen{border-color:#3679ed;color:#4c91ff;background:#202a45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 19px 12px}.stat{background:#22283a;border:1px solid #30364b;border-radius:12px;text-align:center;padding:10px 4px}.stat strong{display:block;font-size:11px;color:#30b17b}.stat:nth-child(2) strong{color:#f14d65}.stat:nth-child(3) strong{color:#e9a72c}.stat input{width:100%;background:transparent;border:0;outline:0;color:#f0f3fb;text-align:center;font-size:18px;font-weight:800;margin-top:5px}.actions{display:flex;gap:11px;margin:0 19px 16px}.tradebtn{flex:1;border-radius:17px;padding:16px 11px;background:#21bd69;color:white;text-align:left;font-size:21px;font-weight:800}.odd{background:#ff4059}.tradebtn span{float:right;font-size:15px}.tradebtn small{display:block;font-size:13px;opacity:.8;font-weight:500}.bottom{display:flex;justify-content:space-around;align-items:center;border-top:1px solid #30364b;background:#202438;padding:12px 4px 18px;color:#78849b;margin-top:12px}.bottom div{text-align:center;min-width:70px;font-size:13px}.bottom b{font-size:24px;display:block;margin-bottom:4px}.ai{background:linear-gradient(135deg,#ff8a4c,#bc50ed);width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:25px;margin:auto}.note{text-align:center;color:#67738a;font-size:10px;padding:10px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#303950;border-radius:10px;padding:12px 14px;max-width:90%;z-index:10;text-align:center}.positions{margin:10px;padding:12px;background:#20263a;border-radius:12px;font-size:12px;max-height:200px;overflow:auto}.positions h3{margin:0 0 8px}.pos{border-top:1px solid #394156;padding:7px;display:flex;justify-content:space-between}.hidden{display:none!important}@media(min-width:700px){body{max-width:480px;margin:auto;border-inline:1px solid #30364b}.chartbox{height:320px}}
</style></head><body>
<header class="top"><span class="menu">☰</span><div class="logo">Q</div><div class="balance">R&nbsp; <span id="balance">$1,000.00</span>⌄</div><span>🔊</span><button class="deposit" onclick="toast('Demo only — deposits disabled')">Deposit</button><span>♧</span></header>
<nav class="tabs"><button class="tab">◎ Matches/Differs</button><button class="tab active">▦ Even/Odd</button><button class="tab">↕ Over/Under</button></nav>
<section class="chartbox"><div class="charthead">▥ &nbsp;<b>Vol 10 (1s)</b><br><small id="price">9500.00 <span style="color:#20bb78">+0.00%</span></small></div><canvas id="chart" class="chart"></canvas><div class="scale"><span>100%</span><span>9502.33</span><span>9494.25</span><span>9486.17</span><span>9478.10</span><span>9470.02</span></div><div class="zoom"><button id="zi">+</button><button id="zo">−</button></div></section>
<section class="nums" id="digits"></section>
<div class="mode"><button class="on" id="auto">AUTO</button><button id="manual">MANUAL</button></div>
<section class="stake"><button class="adj" id="minus">−</button><div class="stakebox"><label>STAKE</label><div class="stakevalue">$ <input id="stake" type="number" min="1" step="1" value="10"></div></div><button class="adj" id="plus">+</button></section>
<div class="quick"><button>$1</button><button>$5</button><button class="chosen">$10</button><button>$25</button><button>$50</button><button>$100</button></div>
<div class="stats"><div class="stat"><strong>TARGET PROFIT</strong><input id="target" type="number" min="0" value="200"></div><div class="stat"><strong>STOP LOSS</strong><input id="stop" type="number" min="0" value="999"></div><div class="stat"><strong>MULTIPLIER</strong><input id="mult" type="number" min="1" step=".1" value="2"></div></div>
<div class="actions"><button class="tradebtn" id="even">Even <span id="payE">$19.52</span><small>95.2% Payout</small></button><button class="tradebtn odd" id="odd">Odd <span id="payO">$19.52</span><small>95.2% Payout</small></button></div>
<div id="positionPanel" class="positions hidden"><h3>Positions · Demo</h3><div id="history">No trades yet</div></div>
<footer class="bottom"><div id="tradeTab"><b>▥</b>Trade</div><div id="aiTab"><div class="ai">✧</div><b style="color:#d05cc8">AI</b></div><div id="positionTab"><b>◷</b>Positions</div></footer><div class="note">QUANTIX DEMO · simulated chart/trades only · no live market data</div>
<script>
const el=id=>document.getElementById(id);let demoBalance=1000,tradeNum=0,autoMode=false,repeatMode=false,repeatSide='',chartZoom=1,priceVal=9500;
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2100)}
let stake=el('stake'),digitSelected=null,percent=[12,9,9.8,9.8,10,10.4,8,8.2,11.4,11.4];
for(let d=0;d<10;d++){let b=document.createElement('button');b.className='num';b.innerHTML=d+'<small>'+percent[d]+'%</small>';b.onclick=()=>{digitSelected=d;document.querySelectorAll('.num').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};el('digits').appendChild(b)}
function getStake(){return Math.max(0,Number(stake.value)||0)}
function update(){let st=getStake(),mult=Math.max(.1,Number(el('mult').value)||1),p=st*1.952*mult;el('payE').textContent='$'+p.toFixed(2);el('payO').textContent='$'+p.toFixed(2);el('balance').textContent='$'+demoBalance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});document.querySelectorAll('.quick button').forEach(q=>q.classList.toggle('chosen',Number(q.textContent.substring(1))===st))}
stake.addEventListener('input',update);['target','stop','mult'].forEach(id=>el(id).addEventListener('input',update));el('minus').onclick=()=>{stake.value=Math.max(1,getStake()-1);update()};el('plus').onclick=()=>{stake.value=getStake()+1;update()};document.querySelectorAll('.quick button').forEach(q=>q.onclick=()=>{stake.value=q.textContent.slice(1);update()});
el('auto').onclick=()=>{autoMode=true;el('auto').classList.add('on');el('manual').classList.remove('on');toast('Auto mode: tap Even or Odd to start demo auto-run')};el('manual').onclick=()=>{autoMode=false;repeatMode=false;el('auto').classList.remove('on');el('manual').classList.add('on')};
function runTrade(side){let st=getStake();if(st<=0){toast('Set a valid stake');return}if(st>demoBalance){toast('Insufficient demo balance');repeatMode=false;return}demoBalance-=st;update();toast('Demo '+side+' order started');setTimeout(()=>{let digit=Math.floor(Math.random()*10),win=(digit%2===0)===(side==='Even'),mult=Math.max(.1,Number(el('mult').value)||1),gross=win?st*1.952*mult:0,net=gross-st;demoBalance+=gross;update();tradeNum++;let row=document.createElement('div');row.className='pos';row.innerHTML='<span>#'+tradeNum+' '+side+' digit '+digit+' '+(win?'WIN':'LOSS')+'</span><b style="color:'+(net>=0?'#22c779':'#ff4e66')+'">'+(net>=0?'+':'')+'$'+net.toFixed(2)+'</b>';el('history').prepend(row);toast('Result '+(win?'WIN':'LOSS')+' · digit '+digit+' · '+(net>=0?'+':'')+'$'+net.toFixed(2));if(repeatMode){let target=Math.max(0,Number(el('target').value)||0),stop=Math.max(0,Number(el('stop').value)||0),profit=demoBalance-1000,loss=1000-demoBalance;if(target>0&&profit>=target){repeatMode=false;toast('Auto stopped: target profit hit')}else if(stop>0&&loss>=stop){repeatMode=false;toast('Auto stopped: stop-loss hit')}else if(demoBalance>=getStake()){setTimeout(()=>runTrade(repeatSide),1200)}else{repeatMode=false;toast('Auto stopped: balance too low')}}},2800)}
el('even').onclick=()=>{repeatMode=autoMode;repeatSide='Even';runTrade('Even')};el('odd').onclick=()=>{repeatMode=autoMode;repeatSide='Odd';runTrade('Odd')};
el('tradeTab').onclick=()=>el('positionPanel').classList.add('hidden');el('positionTab').onclick=()=>{el('positionPanel').classList.remove('hidden');el('positionPanel').scrollIntoView({behavior:'smooth',block:'center'})};el('aiTab').onclick=()=>toast('AI feature is not connected in this demo');
const canvas=el('chart'),ctx=canvas.getContext('2d');let points=Array.from({length:80},()=>Math.random()*65+40);
function render(){let r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let w=r.width,h=r.height;ctx.strokeStyle='#252c40';for(let x=0;x<w;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}let lo=Math.min(...points)-6,hi=Math.max(...points)+6;ctx.beginPath();points.forEach((v,i)=>{let x=i*w/(points.length-1),y=h-(v-lo)*h/(hi-lo);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#d4d8e2';ctx.lineWidth=2;ctx.stroke();priceVal=9500+(points.at(-1)-70)*.12;el('price').innerHTML=priceVal.toFixed(2)+' <span style="color:#20bb78">+0.19%</span>'}
function tick(){points.push(points.at(-1)+(Math.random()-.48)*5);if(points.length>80)points.shift();render()}window.addEventListener('resize',render);el('zi').onclick=()=>{chartZoom=Math.min(3,chartZoom+.25);toast('Zoom '+Math.round(chartZoom*100)+'%')};el('zo').onclick=()=>{chartZoom=Math.max(.5,chartZoom-.25);toast('Zoom '+Math.round(chartZoom*100)+'%')};update();render();setInterval(tick,1000);
</script></body></html>
